<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Email Sender">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile in the app's cyan-to-indigo accent, so the favicon reads
       as a solid mark at 16px instead of a thin glyph on transparency. -->
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>

  <!-- The @ mark: an inner bowl plus the sweeping tail that stops short of
       closing the outer ring. Drawn as strokes so it stays legible when the
       browser scales it down to 16x16. -->
  <g fill="none" stroke="#0b1020" stroke-width="4.2" stroke-linecap="round">
    <circle cx="32" cy="32" r="8.5"/>
    <path d="M40.5 23.5v11.2c0 3.4 2 5.3 4.9 5.3 3.6 0 6.1-3.2 6.1-8.4
             C51.5 20.6 43.6 13 32.4 13 20.6 13 12 21.8 12 33.1
             c0 11.4 8.4 19.4 20.4 19.4 4.2 0 8.1-1 11.3-2.8"/>
  </g>
</svg>
